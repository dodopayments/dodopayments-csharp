# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NuGet in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/dodopayments/dodopayments-csharp/actions/workflows/publish-nuget.yml
name: Publish to NuGet
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      # checkout only needs to read the tagged tree.
      contents: read
      # Required for NuGet Trusted Publishing (OIDC) — this is the identity that
      # nuget.org validates against the trust policy before it will mint a key.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build and pack
        run: dotnet pack
          --configuration Release
          --output "${{github.workspace}}/artifacts/packages"

      # NuGet Trusted Publishing (OIDC), 2026-09-15: replaces the long-lived
      # NUGET_API_KEY, which silently expired after its 365-day maximum lifetime
      # (issued 2025-09-17) and would have failed the next release at the push
      # step only — after release-please had already cut the tag and the GitHub
      # Release, leaving a version that exists on GitHub but not on nuget.org.
      #
      # The key this mints lasts ~1 hour, so it is requested immediately before
      # the push and never stored. `user` is the nuget.org account name (NOT an
      # email) and is public information — it is the package owner shown on
      # nuget.org/packages/DodoPayments.Client — so it is inlined rather than
      # kept as a secret, which would reintroduce the secret this change exists
      # to remove.
      #
      # nuget.org matches the OIDC token against a trust policy keyed on
      # repository owner + repository + THIS FILE'S NAME, so renaming this file
      # breaks publishing until the policy is updated to match.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: dodopayments

      - name: Publish package to nuget.org
        run: dotnet nuget push
          $(find ${{ github.workspace }}/artifacts/packages/*.nupkg ! -name "*.symbols.nupkg")
          --source https://api.nuget.org/v3/index.json
          --api-key $NUGET_API_KEY
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
